<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share File</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('Paperlogy-6SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 36px;
      width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    }

    h1 {
      font-family: 'Paperlogy', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #111;
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 13px;
      color: #999;
      margin-top: 8px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* 버튼 공통 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 10px;
      border: none;
      font-family: 'Paperlogy', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary { background: #111; color: white; width: 100%; }
    .btn-logout {
      background: #f4f4f4;
      color: #555;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .login-form { display: flex; flex-direction: column; gap: 10px; }
    .input {
      width: 100%;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      padding: 11px 14px;
      font-family: 'Paperlogy', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #222;
    }
    .input::placeholder { color: #bbb; }
    .input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(17,17,17,0.07);
    }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .user-email {
      font-size: 12px;
      color: #999;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 타이머 */
    .timer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    /* 업로드 영역 */
    .upload-area {
      border: 2px dashed #e0e0e0;
      border-radius: 14px;
      padding: 32px 16px;
      text-align: center;
      color: #bbb;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .upload-area .upload-icon { color: #ccc; transition: color 0.15s; }
    .upload-area:hover,
    .upload-area.drag-over {
      border-color: #4f8ef7;
      color: #4f8ef7;
      background: #f5f8ff;
    }
    .upload-area:hover .upload-icon,
    .upload-area.drag-over .upload-icon { color: #4f8ef7; }

    /* 업로드 진행 */
    .progress-bar-wrap {
      background: #f0f0f0;
      border-radius: 99px;
      height: 4px;
      margin-bottom: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4f8ef7, #6fa8ff);
      width: 0%;
      transition: width 0.2s;
      border-radius: 99px;
    }
    .progress-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
      display: none;
    }

    /* 업로드 결과 */
    .upload-result {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .upload-result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 8px;
    }
    .upload-result-item.ok  { background: #f0fdf4; color: #166534; }
    .upload-result-item.err { background: #fef2f2; color: #991b1b; }
    .upload-result-item .ri { font-size: 14px; flex-shrink: 0; }
    .upload-result-item .rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 파일 목록 */
    .file-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .file-list-title {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .file-count-badge {
      font-size: 11px;
      color: #888;
      background: #f4f4f4;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .file-list { display: flex; flex-direction: column; gap: 6px; }
    .file-item.new-item { animation: highlight 1.8s ease-out forwards; }
    @keyframes highlight {
      0%   { background: #dbeafe; }
      100% { background: #f7f7f7; }
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: #f7f7f7;
      border-radius: 10px;
      gap: 8px;
      transition: background 0.12s;
    }
    .file-item:hover { background: #f0f0f0; }

    .file-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .file-name {
      font-size: 14px;
      color: #222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .file-size { font-size: 11px; color: #bbb; }

    .file-expires {
      flex-shrink: 0;
      font-size: 11px;
      color: #bbb;
      text-align: right;
      min-width: 64px;
      transition: color 0.3s;
    }
    .file-expires.warn  { color: #f59e0b; }
    .file-expires.urgent { color: #ef4444; font-weight: 600; }

    .btn-download {
      flex-shrink: 0;
      background: white;
      border: 1.5px solid #e8e8e8;
      color: #555;
      padding: 5px 13px;
      font-family: 'Paperlogy', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-download:hover {
      border-color: #111;
      color: #111;
      background: white;
    }

    .empty {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      font-family: 'Paperlogy', sans-serif;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- 로그인 화면 -->
  <div id="login-view">
    <h1>Share File</h1>
    <p class="subtitle">등록된 계정으로 로그인 후 파일을 공유하세요.<br>업로드된 파일은 10분마다 자동 삭제됩니다.</p>
    <form id="login-form" class="login-form">
      <input class="input" id="email-input" type="email" placeholder="이메일" autocomplete="email" required>
      <input class="input" id="password-input" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button class="btn btn-primary" id="login-btn" type="submit">로그인</button>
    </form>
    <div id="access-denied" style="display:none;margin-top:16px;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;font-size:13px;color:#b91c1c;">
      접근 권한이 없습니다. 관리자에게 이메일 등록을 요청하세요.
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="main-view" style="display:none;">
    <div class="header">
      <h1>Share File</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="user-email" id="user-email"></span>
        <button class="btn btn-logout" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <div class="timer" id="timer-display">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>업로드 10분 이후 자동 삭제됩니다. (최대 20분 이내)</span>
    </div>

    <div class="upload-area" id="drop-zone">
      <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span>파일을 여기에 끌어다 놓거나 클릭하여 업로드</span>
      <input type="file" id="file-input" style="display:none" multiple>
    </div>

    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-label" id="progress-label"></div>

    <div class="upload-result" id="upload-result"></div>

    <div class="file-list-header" id="file-list-header" style="display:none;">
      <span class="file-list-title">파일 목록</span>
      <span class="file-count-badge" id="file-count"></span>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // =============================================
  // 설정: Supabase 프로젝트 정보를 입력하세요
  // =============================================
  const FALLBACK_SUPABASE_URL = 'https://vixxkcxympkvaorvsjtx.supabase.co';
  const FALLBACK_SUPABASE_ANON_KEY = 'sb_publishable_QKhLfWgccjCteKJNTChPJQ_R2AD6uef';
  const BUCKET = 'share_file';
  // =============================================

  const { createClient } = supabase;
  let sb = null;

  const loginView   = document.getElementById('login-view');
  const mainView    = document.getElementById('main-view');
  const userEmailEl = document.getElementById('user-email');
  const fileListEl  = document.getElementById('file-list');
  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const timerEl     = document.getElementById('timer-display');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar  = document.getElementById('progress-bar');

  let timerInterval    = null;
  let countdownInterval = null;
  let uploadAllowed    = true;
  let sessionTimeout   = null;
  const SESSION_LIMIT_MS = 10 * 60 * 1000;

  async function loadRuntimeConfig() {
    try {
      const res = await fetch('/api/config', { cache: 'no-store' });
      if (!res.ok) throw new Error('환경설정 응답 실패');
      const cfg = await res.json();
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        throw new Error('환경변수 누락');
      }
      return cfg;
    } catch (_e) {
      return {
        supabaseUrl: FALLBACK_SUPABASE_URL,
        supabaseAnonKey: FALLBACK_SUPABASE_ANON_KEY
      };
    }
  }

  async function initApp() {
    const cfg = await loadRuntimeConfig();
    sb = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    // 인증 상태 감지
    sb.auth.onAuthStateChange(async (_event, session) => {
      if (session) {
        if (!sessionStorage.getItem('loginTime')) {
          sessionStorage.setItem('loginTime', Date.now().toString());
        }
        if (isSessionExpired()) {
          await sb.auth.signOut();
          return;
        }
        scheduleAutoLogout();
        document.getElementById('access-denied').style.display = 'none';
        showMain(session.user);
      } else {
        clearTimeout(sessionTimeout);
        sessionStorage.removeItem('loginTime');
        showLogin();
      }
    });

    // 로그인 (이메일/비밀번호)
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const { error } = await sb.auth.signInWithPassword({
        email,
        password
      });
      if (error) {
        showToast('로그인 오류: ' + error.message);
        return;
      }
    });

    // 로그아웃
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
    });

    const { data } = await sb.auth.getSession();
    if (data.session) {
      if (!sessionStorage.getItem('loginTime')) {
        sessionStorage.setItem('loginTime', Date.now().toString());
      }
      if (isSessionExpired()) {
        await sb.auth.signOut();
      } else {
        scheduleAutoLogout();
        document.getElementById('access-denied').style.display = 'none';
        showMain(data.session.user);
      }
    } else {
      showLogin();
    }
  }

  function isSessionExpired() {
    const loginTime = parseInt(sessionStorage.getItem('loginTime') || '0');
    return loginTime > 0 && Date.now() - loginTime >= SESSION_LIMIT_MS;
  }

  function scheduleAutoLogout() {
    clearTimeout(sessionTimeout);
    const loginTime = parseInt(sessionStorage.getItem('loginTime') || '0');
    if (!loginTime) return;
    const remaining = loginTime + SESSION_LIMIT_MS - Date.now();
    sessionTimeout = setTimeout(async () => {
      showToast('세션이 만료되었습니다. 다시 로그인해 주세요.');
      await sb.auth.signOut();
    }, remaining);
  }

  function showLogin() {
    clearInterval(timerInterval);
    clearInterval(countdownInterval);
    loginView.style.display = 'block';
    mainView.style.display  = 'none';
  }

  async function showMain(user) {
    loginView.style.display = 'none';
    mainView.style.display  = 'block';
    userEmailEl.textContent = user.email;
    await applyIpPermissions();
    loadFiles();
    startTimer();
  }

  async function applyIpPermissions() {
    try {
      const res = await fetch('/api/check-ip', { cache: 'no-store' });
      if (res.ok) {
        const perm = await res.json();
        uploadAllowed = perm.uploadAllowed !== false;
      }
    } catch (_) {}

    if (!uploadAllowed) {
      dropZone.style.pointerEvents = 'none';
      dropZone.style.opacity       = '0.4';
      dropZone.style.cursor        = 'not-allowed';
      dropZone.querySelector('span').textContent = '이 IP에서는 업로드가 허용되지 않습니다';
    } else {
      dropZone.style.pointerEvents = '';
      dropZone.style.opacity       = '';
      dropZone.style.cursor        = '';
      dropZone.querySelector('span').textContent = '파일을 여기에 끌어다 놓거나 클릭하여 업로드';
    }
  }

  // 파일 목록 로드
  // newPaths: 방금 업로드된 스토리지 경로 배열 (하이라이트용)
  async function loadFiles(newPaths = []) {
    // 스토리지 파일 목록 + DB 원본명 매핑을 병렬 조회
    const [{ data, error }, { data: metaRows }] = await Promise.all([
      sb.storage.from(BUCKET).list('', { sortBy: { column: 'created_at', order: 'desc' } }),
      sb.from('file_metadata').select('path, original_name')
    ]);

    fileListEl.innerHTML = '';

    if (error) {
      fileListEl.innerHTML = `<div class="empty">목록을 불러오지 못했습니다</div>`;
      return;
    }

    // path → 원본 파일명 맵
    const nameMap = new Map((metaRows || []).map(r => [r.path, r.original_name]));
    const files   = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder');

    const headerEl = document.getElementById('file-list-header');
    const countEl  = document.getElementById('file-count');

    if (files.length === 0) {
      headerEl.style.display = 'none';
      fileListEl.innerHTML = `
        <div class="empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.3">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
            <polyline points="13 2 13 9 20 9"/>
          </svg>
          <span>업로드된 파일이 없습니다</span>
        </div>`;
      return;
    }

    headerEl.style.display = 'flex';
    countEl.textContent = `${files.length}개`;

    const newSet = new Set(newPaths);

    files.forEach(file => {
      const item = document.createElement('div');
      item.className = 'file-item' + (newSet.has(file.name) ? ' new-item' : '');

      const sizeStr     = file.metadata?.size != null ? formatSize(file.metadata.size) : '';
      const displayName = nameMap.get(file.name) || file.name.replace(/^\d+_/, '');
      const expiresAt   = file.created_at
        ? new Date(file.created_at).getTime() + 10 * 60 * 1000
        : null;

      item.innerHTML = `
        <div class="file-meta">
          <span class="file-name" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</span>
          <span class="file-size">${sizeStr}</span>
        </div>
        <span class="file-expires" data-expires="${expiresAt ?? ''}">--:--</span>
        <button class="btn-download">다운로드</button>
      `;

      item.querySelector('.btn-download').addEventListener('click', () => downloadFile(file.name, displayName));
      fileListEl.appendChild(item);
    });

    startFileCountdowns();
  }

  // 파일 다운로드 — Vercel 프록시를 통해 서버 측 IP 검증 후 전달
  async function downloadFile(storageName, displayName) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showToast('로그인이 필요합니다.'); return; }

    const params = new URLSearchParams({ path: storageName, name: displayName });
    let resp;
    try {
      resp = await fetch(`/api/download?${params}`, {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
    } catch (_e) {
      showToast('다운로드 실패: 네트워크 오류');
      return;
    }

    if (!resp.ok) {
      let msg = '다운로드 실패';
      try { const j = await resp.json(); msg = j.error || msg; } catch (_) {}
      showToast(msg);
      return;
    }

    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = displayName;
    a.click();
    URL.revokeObjectURL(url);
  }

  // 드래그 앤 드롭
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => uploadFiles(Array.from(e.target.files)));

  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    uploadFiles(Array.from(e.dataTransfer.files));
  });

  // 파일 업로드 (순차 처리 + 진행 표시 + 결과 목록)
  async function uploadFiles(files) {
    if (!files.length) return;
    if (!uploadAllowed) { showToast('이 IP에서는 업로드가 허용되지 않습니다.'); return; }

    const resultEl      = document.getElementById('upload-result');
    const labelEl       = document.getElementById('progress-label');
    const total         = files.length;
    const uploadedPaths = [];

    resultEl.innerHTML         = '';
    progressWrap.style.display = 'block';
    labelEl.style.display      = 'block';
    progressBar.style.width    = '0%';

    for (let i = 0; i < total; i++) {
      const file     = files[i];
      const safeName = toSafeStorageName(file.name);
      const path     = `${Date.now()}_${safeName}`;

      labelEl.textContent = `업로드 중… ${i + 1} / ${total}`;

      const { error } = await sb.storage.from(BUCKET).upload(path, file, {
        cacheControl: '3600',
        upsert: false,
        metadata: { originalName: file.name }
      });

      const row = document.createElement('div');
      if (error) {
        row.className = 'upload-result-item err';
        row.innerHTML = `<span class="ri">✕</span><span class="rn" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span><span style="margin-left:auto;font-size:11px;opacity:.7">${escapeHtml(error.message)}</span>`;
      } else {
        // 원본 파일명을 DB에 저장 (새로고침 후에도 한글명 유지)
        await sb.from('file_metadata').insert({ path, original_name: file.name });
        uploadedPaths.push(path);
        row.className = 'upload-result-item ok';
        row.innerHTML = `<span class="ri">✓</span><span class="rn" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>`;
      }
      resultEl.appendChild(row);

      progressBar.style.width = `${Math.round((i + 1) / total * 100)}%`;
    }

    labelEl.textContent = `${uploadedPaths.length} / ${total}개 완료`;
    setTimeout(() => {
      progressWrap.style.display = 'none';
      labelEl.style.display      = 'none';
      progressBar.style.width    = '0%';
    }, 1200);

    fileInput.value = '';
    await loadFiles(uploadedPaths);

    if (uploadedPaths.length > 0) {
      fileListEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // 파일은 업로드 시점 기준으로 약 10분 뒤 자동 삭제
  function startTimer() {
    clearInterval(timerInterval);
  }

  // 파일별 삭제 카운트다운 (매초 갱신)
  function startFileCountdowns() {
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      document.querySelectorAll('.file-expires').forEach(el => {
        const expiresAt = parseInt(el.dataset.expires);
        if (!expiresAt) return;
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) {
          el.textContent = '삭제 대기중';
          el.className = 'file-expires urgent';
          return;
        }
        const m = String(Math.floor(remaining / 60000)).padStart(2, '0');
        const s = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
        el.textContent = `${m}:${s} 후 삭제`;
        el.className = 'file-expires' +
          (remaining < 60000  ? ' urgent' :
           remaining < 180000 ? ' warn'   : '');
      });
    }, 1000);
  }

  // 유틸
  function formatSize(bytes) {
    if (bytes < 1024)           return bytes + ' B';
    if (bytes < 1024 * 1024)    return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toSafeStorageName(name) {
    // S3 키는 ASCII 안전 문자만 허용 — 비ASCII(한글 포함) 및 공백·예약문자를 _ 치환
    const dotIdx = name.lastIndexOf('.');
    const hasExt = dotIdx > 0 && dotIdx < name.length - 1;
    const base   = hasExt ? name.slice(0, dotIdx) : name;
    const ext    = hasExt ? name.slice(dotIdx + 1) : '';
    const safeBase = base.replace(/[^a-zA-Z0-9\-_]/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '') || 'file';
    const safeExt  = ext.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    return safeExt ? `${safeBase}.${safeExt}` : safeBase;
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  initApp();
</script>
</body>
